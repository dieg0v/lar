# Apache. init lo copia a data/config/apache/apache.conf y no lo sustituye si ya tiene contenido.
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
LimitRequestBody 67108864
LogLevel warn
DirectoryIndex index.php index.html
IncludeOptional /etc/apache2/lar-sites/*.conf

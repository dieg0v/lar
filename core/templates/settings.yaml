# General LAR configuration.
# ./lar.sh init does not overwrite this file when it already has content.
#
# default_bind and binds:
#   local  publishes the port only on 127.0.0.1
#   lan    publishes the port on 0.0.0.0
#
# The front nginx publishes http and https.
# https answers only for sites with https: true. The certificate is self-signed.
# Apache and nginx do not publish ports. php is the machine with every version.
# Each version's ini is in core/php/<version>/php.ini.
# init copies it to data/config/php/<version>/php.ini and does not replace it when it already has content.

timezone: Europe/Madrid
default_bind: local

ports:
  http: 80
  https: 443
  mysql57: 3306
  mysql8: 3307
  mariadb1011: 3309
  mariadb101: 33066
  elasticsearch: 9200
  elasticsearch_transport: 9300
  minio: 9000
  minio_console: 9001
  redis: 6379
  mailpit_smtp: 1025
  mailpit_web: 8025

services:
  proxy: true
  apache: true
  nginx: true
  php: true
  mysql57: true
  mysql8: true
  mariadb1011: true
  mariadb101: true
  elasticsearch: true
  minio: true
  redis: true
  mailpit: true

binds:
  http: local
  https: local
  mysql57: local
  mysql8: local
  mariadb1011: local
  mariadb101: local
  elasticsearch: local
  minio: local
  redis: local
  mailpit: local

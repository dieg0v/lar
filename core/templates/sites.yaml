# LAR sites.
# ./lar.sh init does not overwrite this file when it already has content.
# path is the project folder, an absolute path on the system.
# ./lar.sh shell name enters that folder. The name is the site name.
# public_path is what Apache or nginx serves. If omitted, path is served.
# It can be absolute or relative to path, for example public.
# php and node are optional. Without php the site is static HTML:
# no pool is created and ini directives are ignored.
# If the shell has no php or node, it uses the highest installed version.
# server is apache or nginx. If omitted, it is apache.
# node is the shell's Node version, for example "20" or "14.15.0".
# The machine ships 14.15.0, 19.1.0, 20.0.0, and 22.21.1. The highest is the default.
# alias is optional. Other domains for the same site:
# alias:
#   - example.test
#   - api.example.test
# Other keys, when the site has php and they exist in the ini, apply only to that site.
# xdebug is only for that site. false turns it off. true is debug and the IDE listens on 9003.
# coverage measures Codeception coverage. debug,coverage does both.
# https: true creates a self-signed certificate for the domain and its aliases and publishes it on 443.
# ./lar.sh up generates the proxy, Apache or nginx, and PHP pool config.

sites:

# Redis. init copies it to data/config/redis/redis.conf and does not replace it when it already has content.
appendonly yes
appendfsync everysec
dir /data
dbfilename dump.rdb
bind 0.0.0.0
protected-mode no
timeout 300
tcp-keepalive 300
databases 16
maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000

# Redis. init lo copia a data/config/redis/redis.conf y no lo sustituye si ya tiene contenido.
appendonly yes
appendfsync everysec
dir /data
dbfilename dump.rdb
bind 0.0.0.0
protected-mode no
timeout 300
tcp-keepalive 300
databases 16
maxmemory 256mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
